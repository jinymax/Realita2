<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050607" />
    <meta name="description" content="Realita AI 数字人视频对话" />
    <title>Realita — 视频对话</title>
    <link rel="stylesheet" href="./call.css?v=33" />
  </head>
  <body>
    <main class="call-stage" id="callStage">
      <div class="remote-media-background" aria-hidden="true">
        <video class="remote-media-backdrop" id="remoteVideoBackdrop" muted autoplay loop playsinline preload="auto" aria-hidden="true"></video>
        <img class="remote-media-backdrop is-hidden" id="remoteImageBackdrop" alt="" aria-hidden="true" />
        <div class="remote-media-backdrop-shade" aria-hidden="true"></div>
      </div>
      <div class="remote-media-frame" aria-label="远端主播画面">
        <video class="remote-media" id="remoteVideo" autoplay loop playsinline preload="auto"></video>
        <img class="remote-media is-hidden" id="remoteImage" alt="当前虚拟主播" />
        <section class="call-controls" aria-label="视频通话控制">
          <span class="call-timer" id="callTimer">00:00</span>
          <form class="chat-form" id="chatForm">
            <input id="chatInput" type="text" maxlength="300" autocomplete="off" placeholder="输入你想说的话…" />
            <button type="submit" aria-label="发送消息">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5"></path><path d="m6.5 10.5 5.5-5.5 5.5 5.5"></path></svg>
            </button>
          </form>
          <div class="control-row">
            <button class="round-control" id="keyboardControl" type="button" aria-label="打开文字对话" aria-pressed="false">
              <span><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h.01M12 12h.01M16 12h.01M7 16h10"></path></svg></span>
            </button>
            <button class="round-control" id="micControl" type="button" aria-label="打开麦克风" aria-pressed="false">
              <span><svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><path d="M12 19v3M8 22h8"></path></svg></span>
            </button>
            <button class="round-control" id="cameraControl" type="button" aria-label="打开摄像头" aria-pressed="false">
              <span><svg class="camera-on-icon" viewBox="0 0 24 24"><path d="M14 6H4a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2Z"></path><path d="m16 10 5.2-3v10L16 14"></path></svg><svg class="camera-off-icon" viewBox="0 0 24 24"><path d="M10.7 6H14a2 2 0 0 1 2 2v2.5L21.2 7.5v8.6"></path><path d="M16 16a2 2 0 0 1-2 2H4a2 2 0 0 0 2-2V8a2 2 0 0 0 2-2h2"></path><path d="m2 2 20 20"></path></svg></span>
            </button>
            <button class="round-control hangup-control" id="hangupControl" type="button" aria-label="挂断">
              <span><svg class="hangup-icon" viewBox="0 0 1024 1024" aria-hidden="true"><path d="M934.528 554.325333c-14.506667 54.229333-51.925333 69.674667-113.493333 60.970667-72.362667-10.24-133.589333-29.653333-129.109334-92.16 0 0 5.717333-67.285333-170.325333-72.405333-205.44-5.290667-196.693333 74.410667-196.693333 74.410666-0.085333 73.386667-50.773333 77.44-122.965334 88.192-72.234667 10.752-116.394667-7.168-125.269333-87.381333-17.152-154.624 265.386667-194.944 389.333333-196.48 0 0 189.013333-2.858667 279.594667 23.765333l48.768 13.866667c67.968 21.973333 128.981333 61.952 143.146667 118.826667 0 0 8.362667 25.898667-2.986667 68.394666z" fill="currentColor"></path></svg></span>
            </button>
          </div>
        </section>
      </div>
      <div class="call-shade" aria-hidden="true"></div>
      <div class="call-grain" aria-hidden="true"></div>

      <header class="call-header">
        <a class="call-brand" href="./index.html#studio" aria-label="返回 Realita 首页">
          <svg viewBox="0 0 195 231" aria-hidden="true">
            <path d="M54.5 164C73.0015 164 88 178.998 88 197.5C88 216.002 73.0015 231 54.5 231C35.9985 231 21 216.002 21 197.5C21 178.998 35.9985 164 54.5 164ZM78.5 0C121.854 0 157 35.1456 157 78.5C157 96.093 151.212 112.334 141.437 125.423C138.108 129.88 136.064 135.264 136.456 140.812L136.719 144.525C136.904 147.145 137.65 149.693 138.906 151.999L140.115 154.22C144.085 161.507 153.202 164 161.5 164C180.002 164 195 178.998 195 197.5C195 216.002 180.002 231 161.5 231C142.998 231 128 216.002 128 197.5C128 196.061 128.09 194.643 128.267 193.252C129.572 182.943 129.576 171.044 122.05 163.879L120.801 162.69C119.276 161.239 117.533 160.038 115.634 159.131L110.245 156.556C105.599 154.336 100.3 154.108 95.2686 155.203C89.8658 156.38 84.2553 157 78.5 157C35.1456 157 0 121.854 0 78.5C0 35.1456 35.1456 0 78.5 0ZM47.5 53C31.7599 53 19 65.7599 19 81.5C19 97.2401 31.7599 110 47.5 110C63.2401 110 76 97.2401 76 81.5C76 65.7599 63.2401 53 47.5 53Z" fill="currentColor"></path>
            <circle cx="89.5" cy="59.5" r="28.5" fill="#111"></circle>
          </svg>
          <span>Realita</span>
        </a>
        <div class="call-identity" aria-live="polite">
          <span class="online-dot"></span>
          <div><strong id="profileName">小鹿酱</strong><small id="profileRole">甜心主播 · AI 视频对话</small></div>
        </div>
        <button class="sound-chip" id="remoteSound" type="button" aria-label="开启声音" title="开启声音">
          <svg class="sound-off-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6.5 9H3v6h3.5L11 19V5Z"></path><path d="m16 9 5 5M21 9l-5 5"></path></svg>
          <svg class="sound-on-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6.5 9H3v6h3.5L11 19V5Z"></path><path d="M15 9.5a4 4 0 0 1 0 5M18 7a7 7 0 0 1 0 10"></path></svg>
        </button>
      </header>

      <section class="local-preview is-hidden" id="localPreview" aria-label="本地画面预览">
        <video id="localVideo" autoplay muted playsinline></video>
        <span id="previewLabel">你</span>
      </section>

      <aside class="call-performance-panel" aria-label="主播动作和情绪控制">
        <div class="call-performance-grid">
          <button class="call-performance-control" type="button" data-action="wave" aria-pressed="false"><span class="call-performance-icon" aria-hidden="true">〰</span><span>挥手</span></button>
          <button class="call-performance-control" type="button" data-action="nod" aria-pressed="false"><span class="call-performance-icon" aria-hidden="true">↕</span><span>点头</span></button>
          <button class="call-performance-control" type="button" data-action="breathe" aria-pressed="false"><span class="call-performance-icon" aria-hidden="true">◌</span><span>呼吸</span></button>
          <button class="call-performance-control" type="button" data-action="sway" aria-pressed="false"><span class="call-performance-icon" aria-hidden="true">↔</span><span>摇摆</span></button>
          <button class="call-performance-control" type="button" data-action="jump" aria-pressed="false"><span class="call-performance-icon" aria-hidden="true">↑</span><span>跳跃</span></button>
          <button class="call-performance-control" type="button" data-emotion="happy" aria-pressed="false"><span class="call-performance-icon" aria-hidden="true">☺</span><span>开心</span></button>
          <button class="call-performance-control" type="button" data-emotion="calm" aria-pressed="false"><span class="call-performance-icon" aria-hidden="true">◡</span><span>平静</span></button>
          <button class="call-performance-control" type="button" data-emotion="surprised" aria-pressed="false"><span class="call-performance-icon" aria-hidden="true">✦</span><span>惊喜</span></button>
          <button class="call-performance-control active" type="button" data-emotion="shy" aria-pressed="true"><span class="call-performance-icon" aria-hidden="true">◔</span><span>害羞</span></button>
          <button class="call-performance-control" type="button" data-emotion="angry" aria-pressed="false"><span class="call-performance-icon" aria-hidden="true">≋</span><span>生气</span></button>
        </div>
      </aside>

      <aside class="chat-drawer" id="chatDrawer" aria-label="文字对话" aria-hidden="false">
        <div class="chat-heading">
          <div><small>TEXT CHAT</small><strong>与 <span id="chatProfileName">小鹿酱</span> 对话</strong></div>
          <button id="closeChat" type="button" aria-label="关闭文字对话">×</button>
        </div>
        <div class="messages" id="messages" aria-live="polite">
          <div class="message ai-message"><span id="welcomeMessage">你好，很高兴见到你</span><small>刚刚</small></div>
        </div>
      </aside>

      <div class="call-toast" id="callToast" role="status" aria-live="polite"></div>
    </main>
    <script src="./call.js?v=14"></script>
  </body>
</html>
